<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Nova Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/micuenta.css">
</head>
<body>
    <div class="container">
        <div class="header">Hola Eddy</div>
        <div class="card">
            <div>
                <span>Solicita tus e-tickets en tienda</span>
                <p style="margin: 5px 0; font-size: 12px;">Guarda los tickets de tus compras en formato electrónico</p>
            </div>
            <img src="../images/qr-code.png" alt="QR" width="50" onerror="this.style.display='none'">
        </div>
        <div class="menu">
            <div class="menu-item"><img src="../images/bolsa.png" alt="Bolsa" onerror="this.style.display='none'"> Mis compras</div>
            <div class="menu-item"><img src="../images/devolucion.png" alt="Devolución" onerror="this.style.display='none'"> Devoluciones online</div>
            <div class="menu-item"><img src="../images/perfil.png" alt="Perfil" onerror="this.style.display='none'"> Datos personales</div>
            <div class="menu-item"><img src="../images/direcciones.png" alt="Direcciones" onerror="this.style.display='none'"> Direcciones guardadas</div>
        </div>
    </div>
    <div class="accessibility">⚙</div>
</body>
</html>
