<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapatillas Deportivas - Nova Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/producto.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html">← Volver</a>
        <div class="logo" onclick="location.href='../index.html'">NOVA <span>STYLE</span></div>
        <a href="carrito.html">Carrito (<span id="contador">0</span>)</a>
    </nav>

    <div class="container">
        <div class="images">
            <img src="https://static.bershka.net/assets/public/338d/3d33/a2674a64ac59/e2303fb7102b/11640560040-a3o/11640560040-a3o.jpg?ts=1737706641722&w=800" alt="Zapatillas">
            <img src="https://static.bershka.net/assets/public/338d/3d33/a2674a64ac59/e2303fb7102b/11640560040-a1t/11640560040-a1t.jpg" alt="Zapatillas">
            <img src="https://static.bershka.net/assets/public/338d/3d33/a2674a64ac59/e2303fb7102b/11640560040-a2d/11640560040-a2d.jpg" alt="Zapatillas">
        </div>
        <div class="product-details">
            <h1 class="product-title">ZAPATILLAS DEPORTIVAS</h1>
            <p class="price">MXN 1,500.00</p>
            <p>BLANCAS - REF. ZAPAT-001</p>
            <button class="button" onclick="agregarAlCarrito()">AÑADIR A LA CESTA</button>
            <div class="info-box">COMPOSICIÓN, CUIDADOS Y ORIGEN</div>
            <div class="info-box">DISPONIBILIDAD EN TIENDA</div>
            <div class="info-box">ENVÍOS Y DEVOLUCIONES</div>
            <div class="info-box free-shipping">ENVÍO A DOMICILIO - GRATIS</div>
        </div>
    </div>
    
    <div class="sidebar" id="cart-sidebar">
        <div class="sidebar-header">
            <span>Producto añadido</span>
            <button onclick="cerrarSidebar()">✖</button>
        </div>
        <div id="preview-contenido"></div>
        <button class="checkout-button" onclick="location.href='carrito.html'">Ver Cesta</button>
    </div>
    
    <script src="../js/carrito.js"></script>
    <script>
        const PRODUCTO = {
            id: 'zapatillas-deportivas-7',
            nombre: 'Zapatillas Deportivas',
            precio: 1500,
            imagen: 'https://static.bershka.net/assets/public/338d/3d33/a2674a64ac59/e2303fb7102b/11640560040-a3o/11640560040-a3o.jpg?ts=1737706641722&w=800'
        };

        function actualizarContador() {
            document.getElementById('contador').textContent = carrito.obtenerCantidadItems();
        }

        function agregarAlCarrito() {
            carrito.agregarProducto(
                PRODUCTO.id,
                PRODUCTO.nombre,
                PRODUCTO.precio,
                PRODUCTO.imagen,
                1
            );
            
            document.getElementById('preview-contenido').innerHTML = `
                <img src="${PRODUCTO.imagen}" alt="${PRODUCTO.nombre}" style="width: 100%; border-radius: 4px; margin-bottom: 15px;">
                <p><strong>MXN ${PRODUCTO.precio.toLocaleString()}</strong><br>${PRODUCTO.nombre}</p>
            `;
            
            actualizarContador();
            abrirSidebar();
        }

        function abrirSidebar() {
            document.getElementById('cart-sidebar').classList.add('active');
        }

        function cerrarSidebar() {
            document.getElementById('cart-sidebar').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', actualizarContador);
    </script>
</body>
</html>
